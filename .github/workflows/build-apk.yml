name: Build Dakhl-o-Kharj AAB + Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run tests
        run: gradle :app:testDebugUnitTest --no-daemon

      # APK برای نصب و تست روی گوشی
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: KharjYar-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # AAB برای انتشار در Google Play
      - name: Build Release AAB
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: KharjYar-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
