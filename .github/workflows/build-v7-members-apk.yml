name: Build V7 Members Update APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v7:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MAIN explicitly
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Show actual baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "Commit: $(git rev-parse HEAD)"
          grep -nE 'applicationId =|versionCode =|versionName =|kharjyar-v5-debug.keystore' app/build.gradle.kts
          grep -nF 'saveBackupToDownloads' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -nF 'findLatestBackupInDownloads' app/src/main/java/com/example/kharjyar/MainActivity.kt
          test -s app/kharjyar-v5-debug.keystore

      - name: Verify V6 signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/kharjyar-v5-debug.keystore \
            -storepass kharjyar-v5-debug \
            -alias kharjyar-debug >/dev/null
          echo "V5/V6 persistent debug key OK."

      - name: Apply V7 household member update
        run: python3 apply_v7_members_fix.py .

      - name: Verify V7 source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 7' app/build.gradle.kts
          grep -F 'versionName = "1.0.7"' app/build.gradle.kts
          grep -F 'storeFile = file("kharjyar-v5-debug.keystore")' app/build.gradle.kts
          grep -F 'saveBackupToDownloads' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'findLatestBackupInDownloads' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'showMemberAdder' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'fun deleteMember(id: Long): Boolean' app/src/main/java/com/example/kharjyar/LedgerDb.kt
          grep -F 'household_defaults_v7' app/src/main/java/com/example/kharjyar/LedgerDb.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build V7 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Commit V7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/example/kharjyar/MainActivity.kt \
                  app/src/main/java/com/example/kharjyar/LedgerDb.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "V7: household member management"
            git push origin HEAD:main
          fi

      - name: Upload V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: DakhlKharj-V7-Members-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
