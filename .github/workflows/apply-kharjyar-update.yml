name: Apply KharjYar Update + Test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Check update script
        run: python3 -m py_compile apply_kharjyar_update.py

      - name: Apply KharjYar update
        shell: bash
        run: |
          if grep -q 'private data class AnalysisGroupV2' app/src/main/java/com/example/kharjyar/MainActivity.kt; then
            echo "KharjYar UI update already appears to be applied; skipping patch step."
          else
            python3 apply_kharjyar_update.py .
          fi

      - name: Validate patch formatting
        run: git diff --check

      - name: Build Debug APK before committing
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: KharjYar-Updated-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/kharjyar/MainActivity.kt \
                  app/src/main/java/com/example/kharjyar/ReminderSupport.kt \
                  app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Apply dashboard, comparison, settings and reminder update"
            git push
          fi
