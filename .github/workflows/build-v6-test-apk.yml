name: Build V6 Backup + Members Fix Test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v6:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify persistent V5+ debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f app/kharjyar-v5-debug.keystore
          keytool -list \
            -keystore app/kharjyar-v5-debug.keystore \
            -storepass kharjyar-v5-debug \
            -alias kharjyar-debug >/dev/null
          echo "Persistent debug key is present. V6 will update V5."

      - name: Apply V6 backup, restore and household-member fixes
        run: python3 apply_v6_backup_fix.py .

      - name: Verify V6 identity and fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "io.github.hutoto147.dakhlokharj"' app/build.gradle.kts
          grep -F 'versionCode = 6' app/build.gradle.kts
          grep -F 'versionName = "1.0.6"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".debug"' app/build.gradle.kts
          grep -F 'signingConfig = signingConfigs.getByName("stableDebug")' app/build.gradle.kts
          grep -F 'saveBackupToDownloads' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'findLatestBackupInDownloads' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'showMemberAdder' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'fun deleteMember(id: Long): Boolean' app/src/main/java/com/example/kharjyar/LedgerDb.kt
          grep -F 'household_defaults_v6' app/src/main/java/com/example/kharjyar/LedgerDb.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build V6 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK certificate and checksum
        shell: bash
        run: |
          set -euo pipefail
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V6 Test APK
        uses: actions/upload-artifact@v4
        with:
          name: DakhlKharj-V6-Backup-Members-Fix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit V6 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/example/kharjyar/MainActivity.kt \
                  app/src/main/java/com/example/kharjyar/LedgerDb.kt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Fix backup restore and household members for V6"
            git push
          fi
