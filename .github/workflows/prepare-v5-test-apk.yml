name: Prepare V5 source + Test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout the real release/1.0.0 base
        uses: actions/checkout@v4
        with:
          repository: hutoto-147/KharjYar
          ref: release/1.0.0
          path: _upstream_release

      - name: Sync release/1.0.0 source into this repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            _upstream_release/ ./
          rm -rf _upstream_release

      - name: Create persistent V5 debug signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/kharjyar-v5-debug.keystore ]; then
            keytool -genkeypair \
              -keystore app/kharjyar-v5-debug.keystore \
              -storepass kharjyar-v5-debug \
              -alias kharjyar-debug \
              -keypass kharjyar-v5-debug \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DakhlKharj V5 Debug,O=hutoto-147,C=IR"
          fi

      - name: Apply V5 code changes
        run: python3 apply_v5_update.py .

      - name: Verify V5 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "io.github.hutoto147.dakhlokharj"' app/build.gradle.kts
          grep -F 'versionCode = 5' app/build.gradle.kts
          grep -F 'versionName = "1.0.5"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".debug"' app/build.gradle.kts
          grep -F 'signingConfig = signingConfigs.getByName("stableDebug")' app/build.gradle.kts
          grep -F 'class LedgerDb(context: Context) : SQLiteOpenHelper(context, "kharjyar.db", null, 4)' app/src/main/java/com/example/kharjyar/LedgerDb.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build V5 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Show APK certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V5 Test APK
        uses: actions/upload-artifact@v4
        with:
          name: DakhlKharj-V5-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit V5 source and persistent debug key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f app/kharjyar-v5-debug.keystore
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Prepare V5 test build from release/1.0.0"
            git push
          fi
