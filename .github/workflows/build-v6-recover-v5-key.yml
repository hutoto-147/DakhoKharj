name: Recover V5 Key + Build V6 Robust APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V5 source baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "io.github.hutoto147.dakhlokharj"' app/build.gradle.kts
          grep -F 'versionCode = 5' app/build.gradle.kts
          grep -F 'versionName = "1.0.5"' app/build.gradle.kts
          grep -F 'storeFile = file("kharjyar-v5-debug.keystore")' app/build.gradle.kts

      - name: Recover the exact V5 debug signing key from Git history
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/kharjyar-v5-debug.keystore ]; then
            echo "V5 key already exists in the working tree."
          else
            echo "V5 key is not in the current tree. Searching full Git history..."
            KEY_COMMIT="$(git log --all --format='%H' -- app/kharjyar-v5-debug.keystore | head -n 1 || true)"

            if [ -z "${KEY_COMMIT}" ]; then
              echo "::error::The V5 private signing key is not present in reachable Git history."
              echo "::error::Do NOT generate a replacement key if you want to update the installed V5."
              echo "::error::A one-time uninstall/install migration will be required unless the original V5 keystore is recovered."
              exit 42
            fi

            echo "Recovering V5 key from commit ${KEY_COMMIT}"
            git show "${KEY_COMMIT}:app/kharjyar-v5-debug.keystore" > app/kharjyar-v5-debug.keystore
          fi

          test -s app/kharjyar-v5-debug.keystore
          keytool -list -v \
            -keystore app/kharjyar-v5-debug.keystore \
            -storepass kharjyar-v5-debug \
            -alias kharjyar-debug > /tmp/v5-key.txt

          echo "Recovered V5 certificate:"
          grep -E 'Owner:|SHA256:|SHA-256:' /tmp/v5-key.txt || true
          sha256sum app/kharjyar-v5-debug.keystore

      - name: Apply V6 robust backup and household-member fixes
        run: python3 apply_v6_robust_fix.py .

      - name: Verify patched V6 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "io.github.hutoto147.dakhlokharj"' app/build.gradle.kts
          grep -F 'versionCode = 6' app/build.gradle.kts
          grep -F 'versionName = "1.0.6"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".debug"' app/build.gradle.kts
          grep -F 'storeFile = file("kharjyar-v5-debug.keystore")' app/build.gradle.kts
          grep -F 'saveBackupToDownloads' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'showMemberAdder' app/src/main/java/com/example/kharjyar/MainActivity.kt
          grep -F 'fun deleteMember(id: Long): Boolean' app/src/main/java/com/example/kharjyar/LedgerDb.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build V6 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify built APK certificate
        shell: bash
        run: |
          set -euo pipefail
          echo "APK certificate:"
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          echo "APK SHA-256:"
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Commit V6 source and preserve recovered V5 key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts \
                  app/src/main/java/com/example/kharjyar/MainActivity.kt \
                  app/src/main/java/com/example/kharjyar/LedgerDb.kt
          git add -f app/kharjyar-v5-debug.keystore

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "V6: recover V5 signing key and fix backup/members"
            git push
          fi

      - name: Upload V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: DakhlKharj-V6-Recovered-Key-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
